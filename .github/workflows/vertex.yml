name: Vertex

# Tests the app and builds it for Android, iOS, macOS and Windows.
# Pushing a tag like v1.0.0 also publishes the builds as a GitHub Release.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'vertex/**'
      - '.github/workflows/vertex.yml'
  pull_request:
    paths:
      - 'vertex/**'
      - '.github/workflows/vertex.yml'
  workflow_dispatch:

concurrency:
  group: vertex-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'

defaults:
  run:
    working-directory: vertex
    shell: bash

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK + App Bundle)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Collect
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/vertex-android.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/vertex-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: vertex-android
          path: vertex/dist/*
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Collect
        run: |
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../dist/vertex-windows-x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: vertex-windows
          path: vertex/dist/*
          if-no-files-found: error

  macos:
    name: macOS (universal)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Collect
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Vertex.app dist/vertex-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vertex-macos
          path: vertex/dist/*
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned: proves the app builds. Shipping to TestFlight or the App
      # Store needs your Apple Developer signing identity — see the README.
      - run: flutter build ios --release --no-codesign
      - name: Collect
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/vertex-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: vertex-ios
          path: vertex/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
